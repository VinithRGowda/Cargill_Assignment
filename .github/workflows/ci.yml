name: CRR CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend (.NET 10 API)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Backend Dependencies
        working-directory: backend
        run: dotnet restore RiskReporting.slnx

      - name: Build Backend Solution
        working-directory: backend
        run: dotnet build RiskReporting.slnx --no-restore --configuration Release

      - name: Run Backend Unit & Integration Tests
        working-directory: backend
        run: dotnet test RiskReporting.slnx --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend (React + TypeScript + AG Grid)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Tests
        working-directory: frontend
        run: npm test

      - name: Build Frontend Application
        working-directory: frontend
        run: npm run build

